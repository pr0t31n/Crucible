{% extends "base.html" %}

{% block content %}
<style>
.merger-layout {
  max-width: 900px;
  margin: 0 auto;
  padding: 32px 24px;
}
.merger-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 32px;
}
.merger-header h1 {
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--text-primary);
  margin: 0;
}
.merger-back {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.82rem;
  font-weight: 500;
}
.merger-back:hover { color: var(--accent-primary); }
.merger-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 24px;
}
.merger-form label {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-secondary);
  display: block;
  margin-bottom: 4px;
}
.merger-form input[type="text"] {
  width: 100%;
  padding: 10px 14px;
  font-size: 0.88rem;
  font-family: var(--font-mono);
  background: var(--bg-secondary);
  color: var(--text-primary);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  outline: none;
}
.merger-form input[type="text"]:focus {
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 2px rgba(var(--accent-rgb, 59, 130, 246), 0.15);
}
.merger-actions {
  display: flex;
  gap: 10px;
  margin-top: 4px;
}
.btn-scan, .btn-merge {
  padding: 10px 20px;
  font-size: 0.84rem;
  font-weight: 600;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background var(--transition-fast), transform var(--transition-fast);
}
.btn-scan {
  background: var(--bg-tertiary);
  color: var(--text-primary);
}
.btn-scan:hover { background: var(--bg-hover); }
.btn-merge {
  background: var(--accent-primary);
  color: var(--text-inverse);
}
.btn-merge:hover { background: var(--accent-hover); transform: translateY(-1px); }
.btn-merge:disabled, .btn-scan:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}
.merger-sources {
  margin: 24px 0;
}
.merger-sources h3 {
  font-size: 0.82rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.source-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.source-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--bg-secondary);
  border-radius: var(--radius-md);
  font-size: 0.84rem;
}
.source-type {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 2px 8px;
  border-radius: 4px;
  white-space: nowrap;
}
.source-type.crucible { background: var(--accent-primary); color: #fff; }
.source-type.vantage { background: #8b5cf6; color: #fff; }
.source-type.nessus { background: #f59e0b; color: #1a1a1a; }
.source-name {
  color: var(--text-primary);
  font-weight: 500;
}
.source-path {
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 0.76rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-left: auto;
}
.merger-log {
  margin-top: 24px;
  padding: 16px;
  background: var(--bg-tertiary);
  border-radius: var(--radius-md);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text-secondary);
  max-height: 300px;
  overflow-y: auto;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}
.merger-result {
  margin-top: 24px;
  padding: 16px 20px;
  border-radius: var(--radius-md);
  font-size: 0.88rem;
}
.merger-result.success {
  background: rgba(34, 197, 94, 0.1);
  border: 1px solid rgba(34, 197, 94, 0.3);
  color: var(--status-success);
}
.merger-result.error {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: var(--status-error);
}
.merger-result a {
  color: var(--accent-primary);
  font-weight: 600;
  text-decoration: none;
}
.merger-result a:hover { text-decoration: underline; }

.input-with-browse {
  display: flex;
  gap: 8px;
}
.input-with-browse input[type="text"] { flex: 1; }
.btn-browse {
  padding: 10px 16px;
  font-size: 0.82rem;
  font-weight: 600;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--transition-fast);
}
.btn-browse:hover { background: var(--bg-hover); }

.browse-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.browse-overlay:not([hidden]) {
  display: flex;
}
.browse-dialog {
  background: var(--bg-primary);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg, 12px);
  width: 600px;
  max-width: 90vw;
  max-height: 70vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}
.browse-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-default);
}
.browse-header h3 {
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--text-primary);
  margin: 0;
  flex: 1;
}
.browse-path {
  padding: 10px 20px;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text-muted);
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-default);
  display: flex;
  align-items: center;
  gap: 8px;
}
.browse-path-text {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.browse-up {
  padding: 4px 10px;
  font-size: 0.76rem;
  font-weight: 600;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border: 1px solid var(--border-default);
  border-radius: 4px;
  cursor: pointer;
  white-space: nowrap;
}
.browse-up:hover { background: var(--bg-hover); }
.browse-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
  min-height: 200px;
}
.browse-entry {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 20px;
  font-size: 0.84rem;
  color: var(--text-primary);
  cursor: pointer;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.browse-entry:hover { background: var(--bg-hover); }
.browse-entry-icon {
  font-size: 1rem;
  width: 20px;
  text-align: center;
  flex-shrink: 0;
}
.browse-entry-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.browse-entry.is-file { color: var(--text-muted); cursor: default; }
.browse-entry.is-file:hover { background: none; }
.browse-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 14px 20px;
  border-top: 1px solid var(--border-default);
}
.browse-footer button {
  padding: 8px 18px;
  font-size: 0.82rem;
  font-weight: 600;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
}
.browse-cancel {
  background: var(--bg-tertiary);
  color: var(--text-primary);
}
.browse-cancel:hover { background: var(--bg-hover); }
.browse-select {
  background: var(--accent-primary);
  color: var(--text-inverse);
}
.browse-select:hover { background: var(--accent-hover); }
</style>

<div class="merger-layout">
  <div class="merger-header">
    <a href="/" class="merger-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Home
    </a>
    <h1>Engagement Merger</h1>
  </div>

  <div class="merger-form">
    <div>
      <label for="mergerFolder">Source Folder</label>
      <div class="input-with-browse">
        <input type="text" id="mergerFolder" placeholder="/path/to/folder/with/exports">
        <button type="button" class="btn-browse" onclick="openBrowse()">Browse</button>
      </div>
    </div>
    <div>
      <label for="mergerName">Merged Engagement Name (optional)</label>
      <input type="text" id="mergerName" placeholder="Auto-generated if empty">
    </div>
    <div class="merger-actions">
      <button type="button" class="btn-scan" id="btnScan" onclick="scanFolder()">Scan Folder</button>
      <button type="button" class="btn-merge" id="btnMerge" onclick="runMerge()" disabled>Merge</button>
    </div>
  </div>

  <div class="merger-sources" id="sourcesPanel" hidden>
    <h3>Discovered Sources</h3>
    <ul class="source-list" id="sourceList"></ul>
  </div>

  <div class="merger-log" id="logPanel" hidden></div>
  <div class="merger-result" id="resultPanel" hidden></div>
</div>

<div class="browse-overlay" id="browseOverlay" hidden>
  <div class="browse-dialog">
    <div class="browse-header">
      <h3>Select Folder</h3>
    </div>
    <div class="browse-path">
      <button class="browse-up" id="browseUp" onclick="browseUp()">Up</button>
      <span class="browse-path-text" id="browseCurrent">/</span>
    </div>
    <div class="browse-list" id="browseList"></div>
    <div class="browse-footer">
      <button class="browse-cancel" onclick="closeBrowse()">Cancel</button>
      <button class="browse-select" onclick="selectFolder()">Select This Folder</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function _typeClass(t) {
  if (t.startsWith('crucible')) return 'crucible';
  if (t.startsWith('vantage')) return 'vantage';
  if (t.startsWith('nessus')) return 'nessus';
  return '';
}
function _typeLabel(t) {
  const m = {crucible_v2_zip:'Crucible ZIP', crucible_v2_dir:'Crucible Dir',
             vantage_zip:'Vantage ZIP', vantage_dir:'Vantage Dir',
             nessus_xml:'Nessus XML', nessus_csv:'Nessus CSV'};
  return m[t] || t;
}

function _showLog(logs) {
  const el = document.getElementById('logPanel');
  el.hidden = false;
  el.textContent = logs.join('\n');
  el.scrollTop = el.scrollHeight;
}

let _browseDir = '/';
let _browseParent = null;

function openBrowse() {
  const cur = document.getElementById('mergerFolder').value.trim();
  _browseDir = cur || '/clients';
  document.getElementById('browseOverlay').hidden = false;
  loadBrowse(_browseDir);
}

function closeBrowse() {
  document.getElementById('browseOverlay').hidden = true;
}

function selectFolder() {
  document.getElementById('mergerFolder').value = _browseDir;
  closeBrowse();
}

function browseUp() {
  if (_browseParent) loadBrowse(_browseParent);
}

async function loadBrowse(folder) {
  const list = document.getElementById('browseList');
  list.innerHTML = '<div style="padding:20px;color:var(--text-muted);font-size:0.84rem;">Loading...</div>';
  try {
    const resp = await fetch('/api/merger/browse', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({folder})
    });
    const data = await resp.json();
    _browseDir = data.current;
    _browseParent = data.parent;
    document.getElementById('browseCurrent').textContent = data.current;
    document.getElementById('browseUp').disabled = !data.parent;

    list.innerHTML = '';
    if (!data.entries || data.entries.length === 0) {
      list.innerHTML = '<div style="padding:20px;color:var(--text-muted);font-size:0.84rem;">Empty folder</div>';
      return;
    }
    for (const e of data.entries) {
      const btn = document.createElement('button');
      btn.className = 'browse-entry' + (e.is_dir ? '' : ' is-file');
      btn.innerHTML = `<span class="browse-entry-icon">${e.is_dir ? '\u{1F4C1}' : '\u{1F4C4}'}</span>` +
                      `<span class="browse-entry-name">${e.name}</span>`;
      if (e.is_dir) {
        btn.onclick = () => loadBrowse(e.path);
      }
      list.appendChild(btn);
    }
  } catch (err) {
    list.innerHTML = `<div style="padding:20px;color:var(--status-error);font-size:0.84rem;">Error: ${err.message}</div>`;
  }
}

document.getElementById('browseOverlay').addEventListener('click', function(ev) {
  if (ev.target === this) closeBrowse();
});

async function scanFolder() {
  const folder = document.getElementById('mergerFolder').value.trim();
  if (!folder) return;

  document.getElementById('btnScan').disabled = true;
  document.getElementById('btnMerge').disabled = true;
  document.getElementById('resultPanel').hidden = true;
  document.getElementById('sourcesPanel').hidden = true;

  try {
    const resp = await fetch('/api/merger/scan', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({folder})
    });
    const data = await resp.json();
    if (!resp.ok) {
      _showLog([data.error || 'Scan failed']);
      return;
    }
    _showLog(data.logs || []);

    const list = document.getElementById('sourceList');
    list.innerHTML = '';
    (data.sources || []).forEach(s => {
      const li = document.createElement('li');
      li.className = 'source-item';
      li.innerHTML = `<span class="source-type ${_typeClass(s.type)}">${_typeLabel(s.type)}</span>` +
                     `<span class="source-name">${s.name}</span>` +
                     `<span class="source-path" title="${s.path}">${s.path}</span>`;
      list.appendChild(li);
    });

    if (data.sources && data.sources.length > 0) {
      document.getElementById('sourcesPanel').hidden = false;
      document.getElementById('btnMerge').disabled = false;
    } else {
      document.getElementById('sourcesPanel').hidden = true;
    }
  } catch (e) {
    _showLog(['Error: ' + e.message]);
  } finally {
    document.getElementById('btnScan').disabled = false;
  }
}

async function runMerge() {
  const folder = document.getElementById('mergerFolder').value.trim();
  const name = document.getElementById('mergerName').value.trim();
  if (!folder) return;

  document.getElementById('btnMerge').disabled = true;
  document.getElementById('btnScan').disabled = true;
  document.getElementById('resultPanel').hidden = true;

  try {
    const resp = await fetch('/api/merger/merge', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({folder, name: name || undefined})
    });
    const data = await resp.json();
    _showLog(data.logs || []);

    const result = document.getElementById('resultPanel');
    if (data.ok) {
      result.className = 'merger-result success';
      let html = `Merged ${data.source_count} source(s) into <strong>${data.engagement_dir}</strong>`;
      if (data.project_id) {
        html += `<br><a href="/project/${data.project_id}">Open Merged Engagement</a>`;
      }
      result.innerHTML = html;
    } else {
      result.className = 'merger-result error';
      result.textContent = data.error || 'Merge failed';
    }
    result.hidden = false;
  } catch (e) {
    const result = document.getElementById('resultPanel');
    result.className = 'merger-result error';
    result.textContent = 'Error: ' + e.message;
    result.hidden = false;
  } finally {
    document.getElementById('btnMerge').disabled = false;
    document.getElementById('btnScan').disabled = false;
  }
}
</script>
{% endblock %}
